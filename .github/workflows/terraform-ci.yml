# Generated starter workflow — commit with your Terraform root at the repository root (same folder as versions.tf).
# Setup: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure
name: Terraform CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      # Immutable commit pin for actions/checkout v4.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Immutable commit pin for hashicorp/setup-terraform v3.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.6.6"

      # OIDC (recommended): add federated credential on the app registration for GitHub, then set these repo secrets.
      # Alternative: use client_secret with azure/login "enable-AzPSSession" or ARM_* env vars — see azure/login docs.
      # Immutable commit pin for azure/login v2.
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform format (check)
        run: terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform validate
        run: terraform validate

      - name: Install pinned security scanner
        run: python -m pip install --disable-pip-version-check checkov==3.2.495

      - name: Unified SARIF quality gate
        run: |
          checkov -d . --framework terraform -o cli -o sarif --output-file-path console,compliance/quality-gate.sarif

      - name: Terraform plan
        # Saved plans can contain secrets. Generate an apply plan only inside a separately approved apply job.
        run: terraform plan -input=false -no-color
